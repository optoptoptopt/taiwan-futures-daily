# 每個平日 23:00 (台灣) 從 acaiprotocol.com 同步 CSV; 網站本身 20:10 起更新, 留時間給 GitHub 排程延遲
name: sync
on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python sync.py
      - name: 有變更才提交
        if: always()
        run: |
          git config user.name "acaiprotocol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -q -m "資料 $(TZ=Asia/Taipei date +%F)" && git push -q)
